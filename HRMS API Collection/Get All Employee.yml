info:
  name: Get All Employee
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/employees?direction=ASC&sortBy=id
  params:
    - name: direction
      value: ASC
      type: query
    - name: sortBy
      value: id
      type: query
    - name: size
      value: "1"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
